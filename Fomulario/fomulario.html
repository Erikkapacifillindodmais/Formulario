<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="formulario.css">

</head>
<body>

    </div>

    <div class="coluna"></div>


    <div class="conteudo">

            <form action="/submit" method="post">

                <h3>Cadastre-se</h3>

                <div class="form-group">

                    <label for="nome">|Nome</label>

                    <br>

                    <input type="text" name="nome" id="nome" placeholder="Digite seu nome completo...">

                </div>

                <div class="form-group">

                    <label for="data_nascimento">Data de nascimento</label>

                     <br>

                    <input type="date" name="data_nascimento" id=data_nascimento">

                 </div>



                <div class="form-group">

                    <label for="telefone">Telefone</label>

                    <br>

                    <input type="tel" name="telefone" id="telefone" placeholder="(55) 99999-9999" >

                </div>

                <div class="form-group">

                    <label for="email">Email</label>

                    <br>

                    <input type="email" name="email" id="email" placeholder="Digite seu email">

                </div>
                
                <div class="form-group">

                    <label for="pais">Pais</label>

                    <br>

                    <select name="pais" id="pais">

                        <option value="bateria">Brasil</option>
                        <option value="baixo">Estados Unidos</option>
                        <option value="guitarra">Canada</option>
                        <option value="vocal">Mexico</option>
                        <option value="teclado">Reinos Unidos</option>

                    </select>

                </div>

                <br>
                
                <div class="class-group">

                    <label>habilidades</label>

                    <label for="html">
                            <input type="checkbox" id="html" name="habilidades" value="HTML">HTML
                    </label>

                    <label for="css">
                            <input type="checkbox" id="css" name="habilidades" value="CSS">CSS
                    </label>

                    <label for="portugol">
                            <input type="checkbox" id="portugol" name="habilidades" value="portugol">Portugol
                    </label>

                </div>

                <br>

                <div class="form-group">
                    <label for="comentarios">Comentários:</label>
                        <br>
                    <textarea id="comentarios" name="comentarios"> </textarea>
                </div>

                <div class="form-group">
                    <button type="submit">Enviar </button>
                </div>

            </form>

    </div>

    <div class="pe"></div>

</body>
</html>
