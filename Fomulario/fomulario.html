<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="formulario.css">

    <link href="https://cdn.jsdelivr.net/npm/froala-editor@latest/css/froala_editor.pkgd.min.css" rel="stylesheet" type="text/css" />

    <script
        src="https://cdn.jsdelivr.net/npm/froala-editor@latest/js/froala_editor.pkgd.min.js">
    </script>

</head>
<body>

    <div class="coluna"></div>


    <div class="conteudo">

            <form action="/submit" method="post">

                <h3>Cadastre-se</h3>

                <div class="form-group">

                    <label for="nome">|Nome</label>

                    <br>

                    <input type="text" name="nome" id="nome" placeholder="Digite seu nome completo...">

                </div>

                <div class="form-group">

                    <label for="cpf">|Cpf</label>

                    <br>

                    <input type="text" name="cpf" id="cpf" placeholder="000.000.000-00"">

                </div>

                <div class="form-group">

                    <label for="data_nascimento">|Data de nascimento</label>

                     <br>

                    <input type="date" name="data_nascimento" id=data_nascimento">

                 </div>



                <div class="form-group">

                    <label for="telefone">|Telefone</label>

                    <br>

                    <input type="tel" name="telefone" id="telefone" placeholder="(55) 99999-9999" >

                </div>

                <div class="form-group">

                    <label for="email">|Email</label>

                    <br>

                    <input type="email" name="email" id="email" placeholder="Digite seu email">

                </div>
                
                <div class="form-group">

                    <label for="pais">|Pais</label>

                    <br>

                    <select name="pais" id="pais">

                        <option value="bateria">Brasil</option>
                        <option value="baixo">Estados Unidos</option>
                        <option value="guitarra">Canada</option>
                        <option value="vocal">Mexico</option>
                        <option value="teclado">Reinos Unidos</option>

                    </select>

                </div>

                <br>
                
                <div class="class-group">

                    <label>|Habilidades</label>

                    <label for="html">
                            <input type="checkbox" id="html" name="habilidades" value="HTML">HTML
                    </label>

                    <label for="css">
                            <input type="checkbox" id="css" name="habilidades" value="CSS">CSS
                    </label>

                    <label for="portugol">
                            <input type="checkbox" id="portugol" name="habilidades" value="portugol">Portugol
                    </label>

                    <label for="php">
                            <input type="checkbox" id="php" name="habilidades" value="portugol">Php
                    </label>

                    <label for="javascript">
                            <input type="checkbox" id="javascript" name="habilidades" value="portugol">Javascript
                    </label>

                </div>

                

                <br>

                <div class="form-group">

                    <label for="comentarios">|Comentários:</label>

                    <textarea name="comentarios" id="comentarios"></textarea>

                </div>

                <div class="form-group">

                    <label for="senha">|Senha</label>

                    <br>

                    <input type="password" name="senha" id="senha" placeholder="insira senha">

                </div>

                <div class="form-group">
                    <button type="submit">Enviar </button>
                </div>

            </form>

            <script>
                new FroalaEditor('textarea')
            </script>

    </div>

    <div class="pe"></div>

</body>
</html>
